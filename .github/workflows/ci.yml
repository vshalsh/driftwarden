name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        # macOS (~50 min) runs only after merge to main, on push events (L-029).
        include: ${{ fromJSON(github.event_name == 'push' && '[{"os":"macos-latest","python":"3.12"}]' || '[]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Configure git identity for tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Install
        run: python -m pip install -e ".[dev]" pytest-github-actions-annotate-failures
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest -rf
