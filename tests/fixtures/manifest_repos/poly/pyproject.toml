[build-system]
requires = ["hatchling>=1.20"]
build-backend = "hatchling.build"

[project]
name = "poly"
version = "1.0.0"
dependencies = [
    "pydantic>=2",
    "redis[hiredis]>=5.0 ; sys_platform != 'win32'",
    'httpx',
]

[project.optional-dependencies]
docs = ["mkdocs~=1.5"]
test = [
    "pytest>=8",
    "pytest-cov",
]

[dependency-groups]
lint = ["ruff==0.4.1", { include-group = "test" }]

[tool.poetry.dependencies]
python = "^3.10"
celery = "^5.3"
boto3 = { version = ">=1.34", optional = true }

[tool.poetry.group.dev.dependencies]
black = "24.3.0"
